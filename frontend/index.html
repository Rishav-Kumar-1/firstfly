<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ PRIMARY SEO ═══ -->

    <meta name="robots" content="index, follow" />

    <!-- ═══ OPEN GRAPH (Facebook, WhatsApp, LinkedIn previews) ═══ -->

    <!-- ═══ STRUCTURED DATA (Google Rich Results) ═══ -->

    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "FirstFly",
      "alternateName": ["FIRSTFLY", "First Fly", "firstfly"],
      "description": "Book verified, air-conditioned vehicles for family trips, corporate travel, weddings and group tours across India.",
      "url": "https://firstfly.in",
      "telephone": "+91-98771-24650",
      "email": "hsingh67243@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "openingHours": "Mo-Su 00:00-24:00",
      "priceRange": "₹₹",
      "sameAs": [],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Vehicle Fleet",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Urbania Traveller — 17 Seats" } },

          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maruti Suzuki Dzire — 5 Seats" } }
        ]
      }
    }
